[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "feedback-manager"
version = "0.1.2"
description = "Framework-independent feedback management and agent learning: capture, correlate, persist, route, and resolve feedback, and learn validated knowledge from it."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "agents",
    "agent-learning",
    "langgraph",
    "langchain",
    "feedback",
    "human-in-the-loop",
    "hitl",
    "provenance",
    "evaluation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "agxai>=1.0.2,<2",
    "pydantic>=2.14.3,<3",
    "structlog>=26.1.0,<27",
]

[project.optional-dependencies]
# LangChain and LangGraph are one framework family: one extra installs both,
# plus agxai's instrumentation for them.
langchain = [
    "agxai[langgraph]>=1.0.2,<2",
    "langchain-core>=1.7.6,<2",
    "langgraph>=1.2.20,<2",
]
lancedb = ["lancedb>=0.41.0,<0.42; python_version < '3.15'"]
ladybugdb = ["ladybug>=0.22.1,<0.23; python_version < '3.15'"]
otel = ["opentelemetry-api>=1.45.2,<2", "opentelemetry-sdk>=1.45.2,<2"]
all = ["feedback-manager[langchain,lancedb,ladybugdb,otel]"]

[[project.authors]]
name = "S MUNI HARISH"
email = "samamuniharish@gmail.com"

[project.urls]
Homepage = "https://github.com/smuniharish/feedback-manager"
Documentation = "https://feedback-manager.readthedocs.io/"
Changelog = "https://github.com/smuniharish/feedback-manager/blob/master/CHANGELOG.md"
Issues = "https://github.com/smuniharish/feedback-manager/issues"
Repository = "https://github.com/smuniharish/feedback-manager"

[tool.uv.build-backend]
module-name = "feedback_manager"
source-include = [
    "tests/**",
    "examples/**",
    "deploy/**",
    "docs/**",
    "diagrams/**",
    "scripts/**",
    "feedback-manager-skills/**",
    "skills.sh.json",
    ".github/copilot-instructions.md",
    "zensical.toml",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    ".env.example",
    "uv.lock",
    ".containerignore",
    ".dockerignore",
    "CHANGELOG.md",
]
[dependency-groups]
test = [
    "feedback-manager[langchain]",
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6,<7",
    "skills-ref>=0.1.1,<1",
]
lint = ["ruff>=0.17.3"]
types = ["pyrefly>=1.4.1"]
docs = [
    "griffe-pydantic>=1.3.2,<2",
    "mkdocstrings-python>=2.0.10,<3",
    "zensical>=0.1.0,<0.2",
]
examples = [
    "deepagents>=0.7.32,<1",
    "httpx>=0.28.1,<1",
    "langchain>=1.4.9,<2",
    "langchain-mcp-adapters>=0.3.2,<1",
    "langchain-openai>=1.6.7,<2",
    "psycopg[binary,pool]>=3.3.8,<4",
    "psycopg-pool>=3.3.3,<4",
    # pyarrow, a streamlit dependency, has no Python 3.15 wheels yet.
    "streamlit>=1.65.0,<2; python_version < '3.15'",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "types" },
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "error",
  # langsmith 0.14.17 calls asyncio.iscoroutinefunction at import time (deprecated in 3.14).
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
markers = [
    "integration: tests that exercise real LangChain, LangGraph, and agxai",
    "concurrency: tests that exercise concurrent execution paths",
    "postgres: tests requiring FEEDBACK_MANAGER_TEST_POSTGRES_DSN",
    "examples: tests that execute the scripts under examples/",
    "benchmark: performance regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The docs embed example sources with pymdownx.snippets (`--8<--`) directives,
# which a Markdown-aware formatter must not rewrite.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "D",
    "DTZ",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TC",
    "UP",
    "W",
]
ignore = [
    "D105",
    "D107",
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["feedback_manager"]
# The skill templates import each other as local modules.
known-local-folder = ["adapter_template", "store_template"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = [
    "ARG",
    "D",
    "T201",
    # Examples favor plain imports over TYPE_CHECKING blocks for readability.
    "TC",
]
"scripts/**/*.py" = [
    "ARG",
    "D",
    "T201",
]
"tests/**/*.py" = [
    "A002",
    "ARG",
    "D",
    "S101",
    "S105",
    "S106",
    "S108",
]
"feedback-manager-skills/**/scripts/*.py" = [
    "ARG",
    "D",
    "T201",
]
"feedback-manager-skills/**/assets/*.py" = [
    "ARG",
    "D",
    # The assets are pytest templates.
    "S101",
]
# Eval fixtures are deliberately small, and some deliberately flawed, applications.
"feedback-manager-skills/**/evals/files/**/*.py" = [
    "ARG",
    "D",
    "T201",
    "TC",
]
# Callback overrides must accept every argument of LangChain's signatures.
"src/feedback_manager/integrations/frameworks/langchain/callbacks.py" = ["ARG002"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
project-includes = [
    "src",
    "tests",
    "examples",
    "scripts",
    "feedback-manager-skills",
]
search-path = [
    "src",
    ".",
    "examples",
    # The extend skill's tests import its templates as local modules.
    "feedback-manager-skills/skills/feedback-manager-extend/assets",
]

# pyrefly cannot match LangGraph's TypedDict state bound (`StateGraph(State)`),
# so this check is disabled where graphs are built, as in agxai.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
bad-specialization = false

[[tool.pyrefly.sub-config]]
matches = "examples/**"

[tool.pyrefly.sub-config.errors]
bad-specialization = false

[[tool.pyrefly.sub-config]]
matches = "feedback-manager-skills/**"

[tool.pyrefly.sub-config.errors]
bad-specialization = false

[tool.coverage.run]
branch = true
source = ["feedback_manager"]
# CI sets FEEDBACK_MANAGER_OMIT_DATABASE_EXTRAS="*" on Python 3.15, where the lancedb
# and ladybugdb extras have no wheels yet. The default prefix matches no file.
omit = [
    "${FEEDBACK_MANAGER_OMIT_DATABASE_EXTRAS-unset}/storage/vector/lancedb.py",
    "${FEEDBACK_MANAGER_OMIT_DATABASE_EXTRAS-unset}/storage/graph/ladybug.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    '^\s*\.\.\.$',
]
