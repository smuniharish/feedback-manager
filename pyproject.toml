[project]
name = "feedback-manager"
version = "0.1.0"
description = "Production-grade feedback infrastructure for LangChain/LangGraph applications: capture, correlate, persist, route, and resolve feedback as a first-class domain concern."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "S MUNI HARISH", email = "samamuniharish@gmail.com" }
]
requires-python = ">=3.12,<3.15"
keywords = ["langchain", "langgraph", "feedback", "hitl", "human-in-the-loop", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.6,<2",
    "langgraph>=1.2.11,<1.3",
    "langgraph-xai>=0.1.0,<0.2",
    "pydantic>=2.12,<3",
    "structlog>=25.1,<27",
]

[project.urls]
Homepage = "https://github.com/samamuniharish/feedback-manager"
Documentation = "https://feedback-manager.readthedocs.io"
Repository = "https://github.com/samamuniharish/feedback-manager"
Issues = "https://github.com/samamuniharish/feedback-manager/issues"
Changelog = "https://github.com/samamuniharish/feedback-manager/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "coverage[toml]>=7.6",
    "langchain>=1.0,<2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["feedback_manager"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["feedback_manager"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise real langchain/langgraph/langgraph-xai dependencies",
    "concurrency: tests that specifically exercise concurrent execution paths",
]

[tool.coverage.run]
source = ["src/feedback_manager"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
