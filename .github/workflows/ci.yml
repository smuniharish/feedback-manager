name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups --python 3.12
      - name: ruff check
        run: uv run ruff check src tests examples
      - name: ruff format --check
        run: uv run ruff format --check src tests examples

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups --python 3.12
      - name: mypy
        run: uv run mypy src

  test:
    name: Test (pytest, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups --python 3.12
      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest tests -q
          uv run coverage report

  examples:
    name: Run examples (self-contained only)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups --python 3.12
      - name: Run self-contained examples
        # Only examples that run standalone against the default in-memory
        # store are executed here. The following are intentionally
        # excluded because they require external infrastructure this
        # runner does not have (a reachable PostgreSQL/Grafana instance,
        # real MCP server subprocesses, or a real hosted-LLM API key) --
        # they are exercised manually against real infrastructure instead,
        # with genuine captured output documented in docs/examples/*.md:
        #   - postgres_feedback_store.py, 11_grafana_dashboard.py,
        #     12_organic_scenarios_postgres.py (PostgreSQL/Grafana)
        #   - 07_agent_mcp_create_agent.py, 08_agent_deepagents_mcp.py
        #     (real MCP servers + EXPLABS_API_KEY)
        #   - streamlit_feedback_ui.py (interactive UI, not a one-shot script)
        run: |
          for f in examples/01_human_correction.py \
                   examples/02_hitl_approval.py \
                   examples/03_tool_failure.py \
                   examples/04_generation_interruption.py \
                   examples/05_evaluator_feedback.py \
                   examples/06_provenance.py \
                   examples/09_override_defaults.py \
                   examples/10_full_matrix_feedback.py; do
            echo "::group::$f"
            uv run python "$f"
            echo "::endgroup::"
          done

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Build sdist and wheel
        run: uv build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups --python 3.12
      - name: mkdocs build --strict
        run: uv run mkdocs build --strict
