# PostgreSQL and Grafana for the production examples.
#
#   docker compose -f examples/compose.yaml up -d      (or: podman compose ...)
#
# PostgreSQL DSN for the examples:
#   FEEDBACK_MANAGER_POSTGRES_DSN=postgresql://feedback:feedback@localhost:5432/feedback
# Grafana: http://localhost:3000 (user admin, password feedback)
#
# The credentials are local development defaults; never reuse them elsewhere.
name: feedback-manager-examples

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 2s
      timeout: 3s
      retries: 30

  grafana:
    image: docker.io/grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: feedback
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
