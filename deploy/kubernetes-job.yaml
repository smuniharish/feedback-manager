apiVersion: batch/v1
kind: Job
metadata:
  name: feedback-manager-learning-smoke
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: learning
          image: localhost/feedback-manager-learning:0.1.2
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
