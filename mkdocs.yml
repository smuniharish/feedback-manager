site_name: feedback-manager
site_description: Feedback infrastructure for LangChain/LangGraph applications
site_url: https://feedback-manager.readthedocs.io
repo_url: https://github.com/samamuniharish/feedback-manager
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_root_heading: true
            show_source: false
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
      dedent_subsections: true
nav:
  - Home: index.md
  - Agent Skills: agent-skills.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Concepts:
      - Sources: concepts/sources.md
      - Categories: concepts/categories.md
      - Targets: concepts/targets.md
      - Lifecycle: concepts/lifecycle.md
      - Correlation: concepts/correlation.md
      - Provenance: concepts/provenance.md
      - Routing: concepts/routing.md
      - Handlers: concepts/handlers.md
      - Stores: concepts/stores.md
      - Subscriptions: concepts/subscriptions.md
  - Framework guides:
      - LangChain callbacks and tools: frameworks/langchain.md
      - LangGraph human-in-the-loop: frameworks/langgraph.md
  - API:
      - Overview: api/index.md
      - Package exports: api/package.md
      - FeedbackManager: api/manager.md
      - Contracts: api/contracts.md
      - Framework helpers: api/framework-helpers.md
  - Examples:
      - Human correction: examples/human-correction.md
      - HITL approval: examples/hitl-approval.md
      - Tool failure: examples/tool-failure.md
      - Generation interruption: examples/generation-interruption.md
      - Evaluator feedback: examples/evaluator-feedback.md
      - Provenance: examples/provenance.md
      - Production examples:
          - PostgreSQL-backed store: examples/postgres-store.md
          - Human feedback capture UI (Streamlit): examples/streamlit-feedback-ui.md
          - create_agent + real MCP tools: examples/agent-mcp-create-agent.md
          - deepagents + real MCP + HITL: examples/agent-mcp-deepagents.md
          - Overriding every default: examples/override-defaults.md
          - Every source/category/target combination: examples/full-matrix.md
          - Real Grafana observability: examples/grafana-observability.md
  - Advanced:
      - Custom store: advanced/custom-store.md
      - Custom handler: advanced/custom-handler.md
      - Custom router: advanced/custom-router.md
      - Custom source/category: advanced/custom-source-category.md
  - Reliability:
      - Failure isolation: reliability/failure-isolation.md
      - Idempotency: reliability/idempotency.md
      - Concurrency: reliability/concurrency.md
  - Security: security/index.md
  - Testing: testing/index.md
  - Architecture:
      - Overview: architecture/ARCHITECTURE.md
      - Responsibility matrix: architecture/RESPONSIBILITY_MATRIX.md
      - Dependency matrix: architecture/DEPENDENCY_MATRIX.md
      - Domain model: architecture/DOMAIN_MODEL.md
      - Lifecycle model: architecture/LIFECYCLE.md
      - Correlation model: architecture/CORRELATION_MODEL.md
      - Provenance model: architecture/PROVENANCE_MODEL.md
      - Routing model: architecture/ROUTING_MODEL.md
      - Extensibility model: architecture/EXTENSIBILITY_MODEL.md
      - Failure model: architecture/FAILURE_MODEL.md
      - Concurrency model: architecture/CONCURRENCY_MODEL.md
      - Framework boundary model: architecture/FRAMEWORK_BOUNDARY_MODEL.md
      - API contract: architecture/API_CONTRACT.md
      - Testing strategy: architecture/TESTING_STRATEGY.md
      - Security model: architecture/SECURITY_MODEL.md
      - ADRs:
          - 0001 langgraph-xai mandatory dependency: architecture/adr/0001-langgraph-xai-mandatory-dependency.md
          - 0002 reuse before reinventing: architecture/adr/0002-reuse-before-reinventing.md
          - 0003 ABC vs Protocol contracts: architecture/adr/0003-abc-vs-protocol-contracts.md
