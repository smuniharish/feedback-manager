site_name: feedback-manager
site_description: >-
  Feedback infrastructure for LangChain and LangGraph applications: capture,
  correlate, store, route, and resolve feedback as a first-class concern.
site_url: https://feedback-manager.readthedocs.io/en/latest/
repo_name: smuniharish/feedback-manager
repo_url: https://github.com/smuniharish/feedback-manager
edit_uri: edit/master/docs/
copyright: Released under the Apache License 2.0.

watch:
  - src
  - examples

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # Click a diagram or screenshot to open it full size, with zoom.
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            extensions:
              - griffe_pydantic:
                  schema: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Concepts:
      - Overview: concepts/index.md
      - Feedback events: concepts/feedback-events.md
      - Lifecycle: concepts/lifecycle.md
      - Correlation: concepts/correlation.md
      - Provenance: concepts/provenance.md
      - Routing and handlers: concepts/routing.md
      - Storage and queries: concepts/storage.md
      - Subscriptions and streams: concepts/delivery.md
      - Observability: concepts/observability.md
  - How-to guides:
      - Overview: how-to/index.md
      - Record LangChain failures: how-to/langchain-failures.md
      - Record human-in-the-loop decisions: how-to/langgraph-hitl.md
      - Link feedback to provenance: how-to/xai-provenance.md
      - Store feedback in your database: how-to/custom-store.md
      - Route feedback to handlers: how-to/routing.md
      - Configure failure isolation: how-to/failure-isolation.md
      - Expire stale feedback: how-to/expire-feedback.md
      - Test your integration: how-to/testing.md
  - Examples:
      - Overview: examples/index.md
      - Basics: examples/basics.md
      - Agents: examples/agents.md
      - Production: examples/production.md
  - API reference:
      - Overview: api/index.md
      - FeedbackManager: api/manager.md
      - Domain model: api/models.md
      - Contracts: api/contracts.md
      - Routing and handlers: api/routing.md
      - Policies: api/policies.md
      - Observability: api/observability.md
      - Integrations: api/integrations.md
      - Errors: api/errors.md
  - Operations:
      - Security and data handling: operations/security.md
      - Reliability: operations/reliability.md
      - Troubleshooting: operations/troubleshooting.md
  - Design overview: design.md
  - Agent Skills: agent-skills.md
  - FAQ: faq.md
  - Development:
      - Contributing: development/contributing.md
      - Changelog: development/changelog.md
